services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT:           ${PORT:-8000}
      WORKERS_NUMBER: ${WORKERS_NUMBER:-4}
      DB_HOST:        ${DB_HOST}
    volumes:
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, os; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT','8000') + '/api/v' + os.environ.get('API_VERSION','1') + '/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      API_HOST:   app
      API_PORT:   ${PORT:-8000}
      WS_HOST:    ws
      WS_PORT:    ${WS_PORT:-8001}
    ports:
      - "443:443"
    networks:
      - net
    depends_on:
      app:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "uvicorn src.ws_main:app --host 0.0.0.0 --port ${WS_PORT:-8001} --workers ${WORKERS_NUMBER:-4} --no-access-log"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT:           ${WS_PORT:-8001}
      DB_HOST:        ${DB_HOST}
      RABBITMQ_HOST:  rabbitmq
    volumes:
      - logs:/app/logs
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
      image: rabbitmq:4-alpine
      container_name: waslini-rabbitmq
      hostname: rabbitmq
      environment:
          RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-waslini}
          RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-waslini}
      ports:
          - '5672:5672'
      volumes:
          - rabbitmq_data:/var/lib/rabbitmq
      networks:
          - net
      restart: unless-stopped
      healthcheck:
          test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 10s


volumes:
  pgdata:
  logs:
  rabbitmq_data:

networks:
  net:
    driver: bridge
